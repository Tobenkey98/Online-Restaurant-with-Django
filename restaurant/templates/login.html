            
{% load static %}
{% load humanize %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %} {% endblock title %}</title>
        <link rel="stylesheet" href="{% static 'bootstrap-5.3.2-dist/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'fontawesome-free-6.6.0-web/css/all.css' %}">
        <link rel="stylesheet" href="{% static 'form.css'%}">
        <link rel="icon" href="{% static 'images/Restaurant_logo.jpg' %}">
        <style>
            @media (max-width: 575.98px) {
                body {
                    overflow: hidden;
                }
            }
            .foot-lnk2{
                margin-top: -100px;
            }
            
            /* Only responsive adjustments that don't conflict with form.css */
            @media (max-width: 991.98px) {
                .login-image {
                    display: none !important;
                }
                .login-form-container {
                    max-width: 100% !important;
                    padding: 20px !important;
                }
            }

            @media (max-width: 767.98px) {
                .login-html {
                    padding: 30px 20px !important;
                    border-radius: 25px !important;
                }
                .login-html .tab {
                    font-size: 18px !important;
                }
            }

            @media (max-width: 575.98px) {
                .login-html {
                    padding: 25px 15px !important;
                }
                .group .input {
                    padding: 12px 40px !important;
                }
                .group .button {
                    padding: 12px 20px !important;
                }
            }
        </style>
    </head>
    
<body>
    <!-- Loading Animation (keep this in HTML since it's unique) -->
    <div class="loading">
        <div class="loader">
            <div class="plate">
                <div class="food">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
            </div>
        </div>
        <p>Preparing your dining experience...</p>
    </div>

    <div class="login">
        <div class="logo-container">
            <img src="{% static 'images/Restaurant_logo.jpg' %}" width="70" style="border-radius: 100%;">
            <span class="soft text-white">Soft Foods</span>
        </div>

        <div class="container login-container">
            <div class="row justify-content-center align-items-center">
                <!-- Image Column -->
                <div class="col-lg-6 login-image">
                    <img src="{% static 'images/Premium.png' %}" alt="Premium Food" class="img-fluid">
                </div>

                <!-- Form Column -->
                <div class="col-lg-6">
                    <div class="login-form-container">
                        <div class="login-wrap">
                            <div class="login-html">
                                <!-- Rest of your form HTML remains exactly the same -->
                                <input id="tab-1" type="radio" name="tab" class="sign-in" checked><label for="tab-1" class="tab">Sign In</label>
                                <input id="tab-2" type="radio" name="tab" class="sign-up"><label for="tab-2" class="tab">Sign Up</label>

                                {% if messages %}
                                    <script>
                                        {% for message in messages %}
                                            alert("{{ message }}");
                                        {% endfor %}
                                        window.location.reload();
                                    </script>
                                {% endif %}

                                <div class="login-form">
                                    <!-- Sign In Form -->
                                    <form method="POST" class="sign-in-htm" action="">
                                        {% csrf_token %}
                                        <div class="group">
                                            <label for="user" class="label">Username</label>
                                            <input id="user" name="get_username" type="text" class="input" required>
                                            <span class="icon">
                                                <i class="fa fa-user"></i>
                                            </span>
                                        </div>
                                        <div class="group">
                                            <label for="pass" class="label">Password</label>
                                            <input id="pass" type="password" name="get_password" class="input" data-type="password" required>
                                            <span class="icon">
                                                <i class="fa fa-lock"></i>
                                            </span>
                                            <span id="toggle_password" class="icon pass">
                                                <i id="eye_icon" class="fa fa-eye-slash"></i>
                                            </span>
                                        </div>
                                        <div class="group">
                                            <input id="check" type="checkbox" class="check" name="check" checked>
                                            <label for="check"><span class="icons"></span> Keep me Signed in</label>
                                        </div>
                                        <div class="group">
                                            <input type="submit" class="button" value="Sign In">
                                        </div>
                                        <div class="hr"></div>
                                        <div class="foot-lnk">
                                            <a href="{% url 'forgot_password' %}">Forgot Password?</a>
                                        </div>
                                    </form>

                                    <!-- Sign Up Form -->
                                    <form class="sign-up-htm" method="POST" action="">
                                        {% csrf_token %}
                                        <div class="group">
                                            <label for="fullname" class="label">Full Name</label>
                                            <input id="fullname" type="text" name="get_name" class="input form-control">
                                            <span class="icon">
                                                <i class="fa fa-user"></i>
                                            </span>
                                        </div>
                                        <div class="group">
                                            <label for="newuser" class="label">Username</label>
                                            <input id="newuser" type="text" name="get_username" class="input form-control">
                                            <span class="icon">
                                                <i class="fa fa-user"></i>
                                            </span>
                                        </div>
                                        <div class="group">
                                            <label for="email" class="label">Email Address</label>
                                            <input id="email" type="text" name="get_email" class="input form-control">
                                            <span class="icon">
                                                <i class="fa fa-envelope"></i>
                                            </span>
                                        </div>
                                        <div class="group">
                                            <label for="newpass" class="label">Password</label>
                                            <input id="newpass" type="password" name="get_password" class="input form-control" data-type="password">
                                            <span class="icon">
                                                <i class="fa fa-lock"></i>
                                            </span>
                                            <span id="toggle_password2" class="icon pass">
                                                <i id="eye_icon2" class="fa fa-eye-slash"></i>
                                            </span>
                                        </div>
                                        <div class="group">
                                            <label for="confirmpass" class="label">Confirm Password</label>
                                            <input id="confirmpass" type="password" name="confirm_password" class="input form-control" data-type="password">
                                            <span class="icon">
                                                <i class="fa fa-lock"></i>
                                            </span>
                                            <span id="toggle_password3" class="icon pass">
                                                <i id="eye_icon3" class="fa fa-eye-slash"></i>
                                            </span>
                                        </div>
                                        <div class="group">
                                            <input type="submit" class="button" value="Sign Up">
                                        </div>
                                        <div class="hr"></div>
                                        <div class="foot-lnk2 text-center">
                                            <label for="tab-1">Already Member?</label>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Loading animation
        const loading = document.querySelector('.loading');
        window.addEventListener('load', function() {
            loading.style.opacity = '0';
            loading.style.visibility = 'hidden';
            
            setTimeout(() => {
                loading.style.display = 'none';
            }, 500);
        });

        // Password toggle functionality
        document.querySelector('#toggle_password').addEventListener('click', function() {
            const passwordField = document.getElementById('newpass');
            const eyeIcon = document.getElementById('eye_icon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });
        document.querySelector('#toggle_password2').addEventListener('click', function() {
            const passwordField = document.getElementById('newpass');
            const eyeIcon = document.getElementById('eye_icon2');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });

        document.querySelector('#toggle_password3').addEventListener('click', function() {
            const passwordField = document.getElementById('confirmpass');
            const eyeIcon = document.getElementById('eye_icon3');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });

    </script>

    <script src="{% static 'bootstrap-5.3.2-dist/js/bootstrap.bundle.js' %}"></script>
    <script src="{% static 'fontawesome-free-6.6.0-web/js/all.js' %}"></script>
</body>
</html>
