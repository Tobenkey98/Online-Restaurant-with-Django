{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Soft Restaurant</title>
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome-free-6.6.0-web/css/all.css' %}">
    <link rel="stylesheet" href="{% static 'menu.css' %}">
    <link rel="icon" href="{% static 'images/Restaurant_logo.jpg' %}">
    <style>
        .head {
            background-color: #fab217;
            transition: .5s;
            color: #ffbe33;
        }
        .icon {
            position: relative;
        }
        #header-cart-count {
            position: absolute;
            left: -10px;
            top: -5px;
            font-size: 10px;
        }
        #offcanvas-cart-count {
            position: absolute;
            left: 10px;
            top: -5px;
            font-size: 15px;
        }
        .menus {
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
        }
        .head.active {
            background-color: white;
            padding: 10px 20px;
        }
        .head.active a {
            color: black !important;
        }
        .line {
            background-color: #ffffff!important;
            color: black;
            border-color: #fab217!important;
        }
        .nav-link:hover, .search .icon:hover {
            color: #e69c00 !important;
        }
        .navbar a {
            color: white !important;
            margin: 0 15px !important;
            transition: .5s;
            font-weight: bold;
            font-size: 12px;
        }
        @font-face {
            font-family: myfont;
            src: url({% static 'Playwrite_IN/static/PlaywriteIN-Regular.ttf' %});
        }
        .navbar-brand {
            font-family: myfont;
            color: #ffffff;
            font-size: 20px !important;
        }
        .navbar-brand img {
            border-radius: 50%;
        }
        #checkout-link.disabled {
            pointer-events: none;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        } 
        .quantity-controls button {
            width: 30px;
            height: 30px;
            padding: 0;
            font-size: 16px;
            line-height: 1;
            background-color: #e69c00;
            color: white;
            border: none;
        }
        .quantity-controls span {
            width: 40px;
            text-align: center;
        }

        /* New responsive styles */
        .cart-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .cart-header {
            padding: 30px 0;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border-radius: 10px;
        }
        .cart-header h2 {
            font-weight: 700;
            color: #333;
        }
        .cart-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .cart-table th {
            background-color: #fab217;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .cart-table td {
            padding: 15px;
            vertical-align: middle;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .cart-table img {
            max-width: 80px;
            border-radius: 5px;
        }
        .cart-summary {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .btn-warning {
            background-color: #fab217;
            border-color: #fab217;
        }
        .btn-warning:hover {
            background-color: #e69c00;
            border-color: #e69c00;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 18px !important;
            }
            .navbar a {
                margin: 0 10px !important;
                font-size: 11px !important;
            }
            .cart-table thead {
                display: none;
            }
            .cart-table tr {
                display: block;
                margin-bottom: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
            .cart-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
                padding: 10px 15px;
                border-bottom: none;
            }
            .cart-table td:before {
                content: attr(data-label);
                font-weight: bold;
                margin-right: auto;
                padding-right: 20px;
                text-align: left;
            }
            .cart-table td img {
                margin: 0 auto;
            }
            .quantity-controls {
                justify-content: flex-end;
            }
            .action-buttons {
                flex-direction: column;
            }
            .action-buttons a {
                width: 100%;
                text-align: center;
            }
        }
        /* New Modern Loading Animation */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        .loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner-box {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
        }

        .circle-border {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #f0f0f0;
            border-top: 3px solid #ffbe33;
            animation: spin 1s linear infinite;
        }

        .utensils-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffbe33;
            font-size: 20px;
        }

        .loading-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            color: #666;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Animation -->
    <div class="loading" id="loading">
        <div class="spinner-box">
            <div class="circle-border"></div>
            <div class="utensils-icon">
                <i class="fas fa-utensils"></i>
            </div>
        </div>
        <div class="loading-text">Preparing your order...</div>
    </div>
    <header class="sticky-top head">
        <nav class="navbar navbar-expand-lg py-3 px-3 px-md-5">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#"><img src="{% static 'images/Restaurant_logo.jpg' %}" width="50"> Soft Restaurant</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fa fa-bars text-white"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link text-white" href="/home">HOME</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="/about">ABOUT</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="/contact_us">CONTACT</a></li>
                    </ul>
                    <div class="d-flex search text-decoration-none">
                        {% if user.is_authenticated %}
                            <a href="{% url 'user_account' %}" class="icon text-white"><i class="fa fa-user me-3 mt-2"></i></a>
                        {% else %}
                            <a href="{% url 'login' %}" class="icon text-white"><i class="fa fa-user me-3 mt-2"></i> Login</a>
                        {% endif %}
                        <a href="{% url 'cart' %}" class="icon text-white">
                            <i class="fa fa-cart-shopping me-3 mt-2"></i>
                            <span id="header-cart-count" class="badge bg-danger">0</span>
                        </a>
                    </div>
                </div>
            </div> 
        </nav>
    </header>

    <script>
        const header = document.querySelector('.head')
  
        window.addEventListener('scroll', ()=>{
          if(window.scrollY > 40){
            header.classList.add('active')
          }else{
            header.classList.remove('active')
          }
        })
    </script>

    <div class="cart-container">
        <header class="cart-header">
            <h2 class="lead fs-2">Your Cart</h2>
        </header>

        <div class="table-responsive">
            <table class="table cart-table" id="cart-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cart-items">
                    <!-- Cart items will be populated here by JS -->
                </tbody>
            </table>
        </div>

        <div class="cart-summary text-end">
            <h4>Grand Total: <span id="grand-total">₦0.00</span></h4>
        </div>

        <div class="action-buttons">
            <a href="{% url 'menu' %}" class="btn btn-warning text-white">
                <i class="fa fa-arrow-left me-2"></i>Back to menu
            </a>
            <input type="hidden" id="user-email" value="{% if user.is_authenticated %}{{ user.email|escapejs }}{% else %}guest@example.com{% endif %}">
            <a href="#" id="checkout-link" class="btn btn-primary disabled">
                <i class="fa fa-credit-card me-2"></i>Checkout
            </a>
        </div>
    </div>

    <script src="{% static 'bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/js/bootstrap.bundle.js' %}"></script>
    <script src="{% static 'fontawesome-free-6.6.0-web/js/all.js' %}"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="{% static 'cart.js' %}"></script>
    <script>
        // Loading animation
        window.addEventListener('load', function() {
            const loading = document.getElementById('loading');
            if (loading) {
                // Small delay to ensure content is ready
                setTimeout(() => {
                    loading.classList.add('hidden');
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 500);
                }, 500);
            }
        });
    </script>
</body>
</html>
