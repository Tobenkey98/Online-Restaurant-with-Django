{% load static %}
{% load humanize %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password</title>
        <link rel="stylesheet" href="{% static 'bootstrap-5.3.2-dist/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'fontawesome-free-6.6.0-web/css/all.css' %}">
        <link rel="stylesheet" href="{% static 'bootstrap-5.3.2-dist/bootstrap-5.3.3-dist/CAOS.file/CAOS.file.v-1.5/style.css' %}">
        <link rel="stylesheet" href="{% static 'restaurant.css'%}">
        <link rel="stylesheet" href="{% static 'form.css'%}">
    </head>
    
<body>
    <!-- Loading Animation -->
    <div class="loading" id="loading">
        <div class="spinner-box">
            <div class="circle-border"></div>
            <div class="utensils-icon">
                <i class="fas fa-utensils"></i>
            </div>
        </div>
        <div class="loading-text">Preparing your order...</div>
    </div>
    <div class="login">
        <style>
            .login-wrap{
                width:100%;
                margin:auto;
                max-width:525px;
                min-height:850px;
                position:relative;
                box-shadow:0 12px 15px 0 #1d1d1d65,0 17px 50px 0 #050505c5;
            }
            /* New Modern Loading Animation */
            .loading {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #ffffff;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
            }

            .loading.hidden {
                opacity: 0;
                visibility: hidden;
            }

            .spinner-box {
                position: relative;
                width: 60px;
                height: 60px;
                margin-bottom: 20px;
            }

            .circle-border {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                border: 3px solid #f0f0f0;
                border-top: 3px solid #ffbe33;
                animation: spin 1s linear infinite;
            }

            .utensils-icon {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #ffbe33;
                font-size: 20px;
            }

            .loading-text {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 16px;
                color: #666;
                letter-spacing: 0.5px;
                font-weight: 500;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
        <div class="container-fluid mt-2 px-5">
            <img src="{% static 'images/Restaurant_logo.jpg' %}" width="70" style="border-radius: 100%;" >
            <span class="soft text-white">Soft Foods</span>
        </div>
        <div class="row align-items-center justify-content-center">
            <div class="col-md-6">
                <div class="login-wrap">
                    <div class="login-html">
                        <h3 class="text-center mb-4">Reset Password</h3>
                        <p class="text-center text-muted mb-4">Please enter your new password below.</p>
                        
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <div class="login-form">
                            <form method="POST" action="{% url 'reset_password' token=token %}">
                                {% csrf_token %}
                                <div class="group">
                                    <label for="get_password" class="label">New Password</label>
                                    <input id="get_password" type="password" name="get_password" class="input form-control" required>
                                    <span class="icon">
                                        <i class="fa fa-lock"></i>
                                    </span>
                                    <span id="toggle_password" class="icon pass">
                                        <i id="eye_icon" class="fa fa-eye-slash"></i>
                                    </span>
                                </div>
                                <div class="group">
                                    <label for="confirm_password" class="label">Confirm New Password</label>
                                    <input id="confirm_password" type="password" name="confirm_password" class="input form-control" required>
                                    <span class="icon">
                                        <i class="fa fa-lock"></i>
                                    </span>
                                    <span id="toggle_password2" class="icon pass">
                                        <i id="eye_icon2" class="fa fa-eye-slash"></i>
                                    </span>
                                </div>
                                
                                <div class="group">
                                    <input type="submit" class="button" value="Reset Password">
                                </div>
                                <div class="hr"></div>
                                <div class="foot-lnk text-center">
                                    <a href="{% url 'login' %}">Back to Login</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'bootstrap-5.3.2-dist/js/bootstrap.bundle.js' %}"></script>
    <script src="{% static 'fontawesome-free-6.6.0-web/js/all.js' %}"></script>
    <script>
        // Loading animation
        window.addEventListener('load', function() {
            const loading = document.getElementById('loading');
            if (loading) {
                // Small delay to ensure content is ready
                setTimeout(() => {
                    loading.classList.add('hidden');
                    setTimeout(() => {
                        loading.style.display = 'none';
                    }, 500);
                }, 500);
            }
        });
    </script>
    <script>
        // Toggle password visibility for first password field
        document.querySelector('#toggle_password').addEventListener('click', function () {
            const passwordField = document.querySelector('#get_password');
            const eyeIcon = document.querySelector('#eye_icon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });

        // Toggle password visibility for confirm password field
        document.querySelector('#toggle_password2').addEventListener('click', function () {
            const passwordField = document.querySelector('#confirm_password');
            const eyeIcon = document.querySelector('#eye_icon2');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });
    </script>
</body>
</html>
